name: Instagram Username Checker

on:
  # Allows you to trigger the workflow manually from the GitHub UI
  workflow_dispatch:
    inputs:
      usernames:
        description: 'Comma-separated usernames to check'
        required: false
        default: 'instagram, cristiano, this_is_a_very_long_username_that_is_surely_free'
  # (Optional) Uncomment to run automatically every day at 8:00 AM UTC
  # schedule:
  #   - cron: '0 8 * * *'

jobs:
  check-usernames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests fake-useragent

      - name: Run Instagram checker
        env:
          # Pass the manual input to the script as an environment variable
          USERNAMES_INPUT: ${{ github.event.inputs.usernames }}
        run: python instagram_checker.py
